<body>
<div class="layout">
  <nav class="games">
    <header>
      <h1>SPL XIII &middot; ADV OU</h1>
      <p class="seasons"><a href="../spl4_adv_replays/">SPL IV</a> &middot; <a href="../spl5_adv_replays/">SPL V</a> &middot; <a href="../spl6_adv_replays/">SPL VI</a> &middot; <a href="../spl7_adv_replays/">SPL VII</a> &middot; <a href="../spl8_adv_replays/">SPL VIII</a> &middot; <a href="../spl9_adv_replays/">SPL IX</a> &middot; <a href="../spl10_adv_replays/">SPL X</a> &middot; <a href="../spl11_adv_replays/">SPL XI</a> &middot; <a href="../spl12_adv_replays/">SPL XII</a> &middot; <strong>SPL XIII</strong> &middot; <a href="../spl14_adv_replays/">SPL XIV</a> &middot; <a href="../spl15_adv_replays/">SPL XV</a> &middot; <a href="../spl16_adv_replays/">SPL XVI</a> &middot; <a href="../spl17_adv_replays/">SPL XVII</a></p>

  <main>
    <div id="info"></div>

<script src="../showdown_play_local/play/js/replay-embed.js"></script>
<script>
(function () {
  var GAMES = JSON.parse(document.getElementById('spl-games').textContent);
  var NO_LOG = [["Week 9", "[WOL] Star vs ABR [TYR]", "listed in the thread without a replay link"]];
  var byId = {};
  GAMES.forEach(function (g, i) { g.index = i; byId[g.id] = g; });
  var current = null, speed = null;

  // A "Last turn" button that jumps to the start of the game's final turn (user 2026-11-16). Showdown's own
  // "Last turn" button steps back one turn, so it is relabelled "Previous turn". The player redraws its buttons on
  // every play/pause (Replays.update), so they are adjusted after each redraw; a button's data-action names the
  // Replays method it calls.
  Replays.lastturn = function () {
    if (this.battle && current) this.battle.seekTurn(current.turns);
  };
  var showdownUpdate = Replays.update;
  Replays.update = function (state) {
    showdownUpdate.call(this, state);
    var $c = this.$('.replay-controls');
    $c.find('button[data-action="rewind"]').html('<i class="fa fa-step-backward"></i> Previous turn');
    if (!$c.find('button[data-action="lastturn"]').length) {
      $c.find('button[data-action="ff"]').after('<button data-action="lastturn"><i class="fa fa-fast-forward"></i> Last turn</button>');
    }
  };

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) {
    return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); }
  // The list shows each game's title only: no turns, no result (user 2026-11-16)
  function buildList() {
    var html = '', section = null;
    var order = [];
    GAMES.forEach(function (g) { if (order.indexOf(g.section) < 0) order.push(g.section); });
    order.forEach(function (sec) {
      html += '<div class="week" data-sec="' + esc(sec) + '"><h2>' + esc(sec) + '</h2>';
      GAMES.filter(function (g) { return g.section === sec; }).forEach(function (g) {
        var hay = (g.title + ' ' + g.players.join(' ') + ' ' + g.teams.map(function (t) {
          return t.map(function (m) { return (m.species || '') + ' ' + m.nick; }).join(' '); }).join(' ')).toLowerCase();
        html += '<button class="game" data-id="' + g.id + '" data-hay="' + esc(hay) + '">' +
          '<span class="t">' + esc(g.title) + '</span></button>';
      });
      NO_LOG.filter(function (n) { return n[0] === sec; }).forEach(function (n) {
        html += '<div class="nolog">' + esc(n[1]) + ' &mdash; ' + esc(n[2]) + '</div>';
      });
      html += '</div>';
    });
    document.getElementById('list').innerHTML = html;
    document.getElementById('list').addEventListener('click', function (e) {
      var b = e.target.closest('.game');
      if (b) select(b.getAttribute('data-id'), true);
    });
    document.getElementById('filter').addEventListener('input', function () {
      var q = this.value.trim().toLowerCase();
      document.querySelectorAll('.game').forEach(function (b) {
        b.style.display = !q || b.getAttribute('data-hay').indexOf(q) >= 0 ? '' : 'none';
      });
    });
  }

  // Above the player: the game's title and a link to the original log or replay, nothing else (user 2026-11-16)
  function info(g) {
    var srcLabel = 'original log on pastebin';
    if (g.native) {
      srcLabel = g.source.indexOf('replay.pokemonshowdown.com') >= 0 ? 'original replay on Showdown'
        : 'replay file saved from Showdown (Mediafire)';
    }
    var prev = GAMES[g.index - 1], next = GAMES[g.index + 1];
    var h = '<h2>' + esc(g.section) + ' &middot; ' + esc(g.title) + '</h2>' +
      '<p class="meta"><a href="' + esc(g.source) + '" target="_blank" rel="noopener">' + srcLabel + '</a></p>' +
      '<div class="nav"><button data-go="' + (prev ? prev.id : '') + '"' + (prev ? '' : ' disabled') + '>&larr; Previous game</button>' +
      '<button data-go="' + (next ? next.id : '') + '"' + (next ? '' : ' disabled') + '>Next game &rarr;</button></div>';
    var el = document.getElementById('info');
    el.innerHTML = h;
    el.querySelectorAll('button[data-go]').forEach(function (b) {
      b.addEventListener('click', function () { if (b.getAttribute('data-go')) select(b.getAttribute('data-go'), true); });
    });
    document.querySelectorAll('.game').forEach(function (b) {
      b.classList.toggle('sel', b.getAttribute('data-id') === g.id);
    });
  }

  function select(id, user) {
    var g = byId[id] || GAMES[0];
    if (current === g) return;
    current = g;
    if (user && history.replaceState) history.replaceState(null, '', '#' + g.id);
    info(g);
    loadBattle(0);
  }

  // (Re)start Showdown's player on the current game's log, optionally at a turn
  function loadBattle(turn) {
    $('script.battle-log-data').text(current.log);
    if (!Replays.battle) return;
    // keep the viewer's speed choice across reloads
    var sel = $('.speedchooser button.sel').val();
    if (sel) speed = sel;
    try { Replays.battle.pause(); Replays.battle.destroy(); } catch (e) {}
    Replays.$el.off();
    Replays.$el.html('<div class="battle"></div><div class="battle-log"></div><div class="replay-controls"></div><div class="replay-controls-2"></div>');
    Replays.battle = null;
    Replays.init();
    if (speed && speed !== 'normal') Replays.changeSetting('speed', speed);
    if (document.body.classList.contains('dark')) Replays.changeSetting('color', 'dark');
    if (turn) Replays.battle.seekTurn(turn);
  }

  // A species the log never names (the converter writes "Missingno.", which has no Gen 3 sprite) is drawn with
  // the substitute sprite instead of a broken image.
  function patchSprites() {
    var orig = Dex.getSpriteData.bind(Dex);
    Dex.getSpriteData = function (pokemon, isFront, options) {
      var d = orig(pokemon, isFront, options);
      var name = (pokemon && pokemon.getSpeciesForme) ? pokemon.getSpeciesForme() : pokemon;
      var sp = Dex.species.get(name);
      if (!sp.exists || !(sp.num > 0)) {
        d.url = Dex.resourcePrefix + 'sprites/gen3' + (isFront ? '' : '-back') + '/substitute.png';
        d.w = 96; d.h = 96;
      }
      return d;
    };
  }

  buildList();
  var first = (location.hash || '').slice(1);
  var initial = byId[first] || GAMES[0];
  current = null;
  // replay-embed.js starts the player on window load from script.battle-log-data: fill it first
  info(initial);
  current = initial;
  document.querySelector('script.battle-log-data').textContent = initial.log;
  var embedInit = window.onload;
  window.onload = function () {
    patchSprites();
    embedInit();
    var b = document.querySelector('.game.sel');
    if (b && b.scrollIntoView) b.scrollIntoView({block: 'center'});
  };
  window.addEventListener('hashchange', function () {
    var id = location.hash.slice(1);
    if (byId[id]) select(id, false);
  });
})();
</script>
