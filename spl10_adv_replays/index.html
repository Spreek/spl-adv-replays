    });
    document.getElementById('filter').addEventListener('input', function () {
      var q = this.value.trim().toLowerCase();
      document.querySelectorAll('.game').forEach(function (b) {
        b.style.display = !q || b.getAttribute('data-hay').indexOf(q) >= 0 ? '' : 'none';
      });
    });
  }

  // Above the player: the game's title and a link to the original log or replay, nothing else (user 2026-11-16)
  function info(g) {
    var srcLabel = 'original log on pastebin';
    if (g.native) {
      srcLabel = g.source.indexOf('replay.pokemonshowdown.com') >= 0 ? 'original replay on Showdown'
        : 'replay file saved from Showdown (Mediafire)';
    }
    var prev = GAMES[g.index - 1], next = GAMES[g.index + 1];
    var h = '<h2>' + esc(g.section) + ' &middot; ' + esc(g.title) + '</h2>' +
      '<p class="meta"><a href="' + esc(g.source) + '" target="_blank" rel="noopener">' + srcLabel + '</a></p>' +
      '<div class="nav"><button data-go="' + (prev ? prev.id : '') + '"' + (prev ? '' : ' disabled') + '>&larr; Previous game</button>' +
      '<button data-go="' + (next ? next.id : '') + '"' + (next ? '' : ' disabled') + '>Next game &rarr;</button></div>';
    var el = document.getElementById('info');
    el.innerHTML = h;
    el.querySelectorAll('button[data-go]').forEach(function (b) {
      b.addEventListener('click', function () { if (b.getAttribute('data-go')) select(b.getAttribute('data-go'), true); });
    });
    document.querySelectorAll('.game').forEach(function (b) {
      b.classList.toggle('sel', b.getAttribute('data-id') === g.id);
    });
  }

  function select(id, user) {
    var g = byId[id] || GAMES[0];
    if (current === g) return;
    current = g;
    if (user && history.replaceState) history.replaceState(null, '', '#' + g.id);
    info(g);
    loadBattle(0);
  }

  // (Re)start Showdown's player on the current game's log, optionally at a turn
  function loadBattle(turn) {
    $('script.battle-log-data').text(current.log);
    if (!Replays.battle) return;
    // keep the viewer's speed choice across reloads
    var sel = $('.speedchooser button.sel').val();
    if (sel) speed = sel;
    try { Replays.battle.pause(); Replays.battle.destroy(); } catch (e) {}
    Replays.$el.off();
    Replays.$el.html('<div class="battle"></div><div class="battle-log"></div><div class="replay-controls"></div><div class="replay-controls-2"></div>');
    Replays.battle = null;
    Replays.init();
    if (speed && speed !== 'normal') Replays.changeSetting('speed', speed);
    if (document.body.classList.contains('dark')) Replays.changeSetting('color', 'dark');
    if (turn) Replays.battle.seekTurn(turn);
  }

  // A species the log never names (the converter writes "Missingno.", which has no Gen 3 sprite) is drawn with
  // the substitute sprite instead of a broken image.
  function patchSprites() {
    var orig = Dex.getSpriteData.bind(Dex);
    Dex.getSpriteData = function (pokemon, isFront, options) {
      var d = orig(pokemon, isFront, options);
      var name = (pokemon && pokemon.getSpeciesForme) ? pokemon.getSpeciesForme() : pokemon;
      var sp = Dex.species.get(name);
      if (!sp.exists || !(sp.num > 0)) {
        d.url = Dex.resourcePrefix + 'sprites/gen3' + (isFront ? '' : '-back') + '/substitute.png';
        d.w = 96; d.h = 96;
      }
      return d;
    };
  }

  buildList();
  var first = (location.hash || '').slice(1);
  var initial = byId[first] || GAMES[0];
  current = null;
  // replay-embed.js starts the player on window load from script.battle-log-data: fill it first
  info(initial);
  current = initial;
  document.querySelector('script.battle-log-data').textContent = initial.log;
  var embedInit = window.onload;
  window.onload = function () {
    patchSprites();
    embedInit();
    var b = document.querySelector('.game.sel');
    if (b && b.scrollIntoView) b.scrollIntoView({block: 'center'});
  };
  window.addEventListener('hashchange', function () {
    var id = location.hash.slice(1);
    if (byId[id]) select(id, false);
  });
})();
</script>
</body>
</html>
